[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "ud-co2s"
version = "1.2.1"
description = "Python package for reading sensor data from IODATA UD-CO2S or Pocket CO2 Sensor"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "aioserial>=1.3.1",
  "attrs>=25.3",
  "pandas>=2.3.2",
  "plotext>=5.3.2",
  "pyserial>=3.5",
  "pystray>=0.19.5",
  "rich>=10",
  "seaborn>=0.13.2",
  "tenacity>=9.1.2",
  "thermofeel>=2.1.1",
  "typer>=0.28.0,<1",
  "unhandled-exit>=1",
]
urls."Bug Tracker" = "https://github.com/34j/ud-co2s/issues"
urls.Changelog = "https://github.com/34j/ud-co2s/blob/main/CHANGELOG.md"
urls.documentation = "https://ud-co2s.readthedocs.io"
urls.repository = "https://github.com/34j/ud-co2s"
scripts.ud-co2s = "ud_co2s.cli:app"

[dependency-groups]
dev = [
  "coverage",
  "packaging-34j[test]>=1.1.3",
  "pytest>=9",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.per-file-ignores."docs/conf.py" = [ "A001", "D401", "F403" ]
lint.per-file-ignores."src/ud_co2s/_main.py" = [
  "DOC202",
  "DOC501",
  "DOC502",
  "RET504",
  "TRY301",
]
lint.per-file-ignores."src/ud_co2s/cli.py" = [
  "BLE001",
  "C419",
  "C901",
  "DTZ005",
  "FBT001",
  "FBT002",
  "N806",
  "PLC1901",
  "PLR2004",
  "PLW0108",
  "PLW0602",
  "PLW0603",
  "PLW0604",
  "PLW1514",
  "SIM102",
  "TRY401",
]
lint.per-file-ignores."tests/test_dunder_main.py" = [ "S404", "S603" ]
lint.per-file-ignores."tests/test_main.py" = [ "PLC2701" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
